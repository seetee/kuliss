[project]
name = "kuliss"
version = "3.0.0"
description = "Kdenlive tools for Samkväm: speaker overlay, session notes, YouTube chapters"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "seetee" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2",
    "av>=14",
    "skia-python>=138",
    "silero-vad-lite>=0.2",
]

[project.urls]
Repository = "https://github.com/seetee/kuliss"

[project.scripts]
kuliss = "kuliss.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
