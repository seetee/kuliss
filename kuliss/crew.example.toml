# kuliss.toml: the crew file, one for all sessions. Put it in _assets/ next to the
# session_* folders. kuliss new and kuliss sync set these on the tracks they create;
# change them in Kdenlive afterwards as you like. Everything is optional: 0 dB, centred.
# [software] lists each game's lines for a new session's notes file.

# Where older sessions are moved to free space, as <archive>/<game folder>/session_*.
# kuliss new counts them when it numbers the next session (absolute, or relative to the
# show folder). Leave it out if every session stays in its game folder.
# archive = "/home/alice/archive/show.archive"

master_gain = 10.0    # dB, the sequence's master volume
assets_gain = -21.0   # dB, the Assets audio track (intro and outro music)
game_gain   = -21.5   # dB, every player's "<I> Game" track

# one section per player, named as in their "<Name> Voice" track
[voice.Alice]
gain = 9.5            # dB, -60 to 20
pan = 0.56            # 0 left, 0.5 centre, 1 right
contrast = 33         # Kdenlive's "Audio contrast" effect, 0-100; 0 or omitted = none

[voice.Bob]
gain = -4.0
pan = 0.44

# Software versions per game, written as the notes file's lines (indent two spaces for a
# sub-item). kuliss new offers each game (the first is the default) or none; OBS, Kdenlive
# and kuliss are always added after them.
[software]
"Project Ozone 3" = [
    "* Prism Launcher 9.2",
    "* Project Ozone 3 3.4.10",
    "* Minecraft 1.12.2",
    "* Resource packs",
    "  * Faithful 32x",
]
